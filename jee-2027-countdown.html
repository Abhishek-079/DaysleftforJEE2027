<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Days Left for IIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d0c;
    --surface:#121613;
    --surface-2:#191f1b;
    --border:#252c27;
    --text:#eef2ef;
    --muted:#8a9691;
    --muted-2:#586360;

    --green-1:#0a2b1f;
    --green-2:#0e4530;
    --green-3:#0e6b45;
    --green-4:#0f9860;
    --green-5:#08bd80;
    --blue:#2d81f7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  #particles{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:0;pointer-events:none;
  }
  .wrap{position:relative;z-index:1;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(8,189,128,0.13), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(45,129,247,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:36px 20px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  h1{
    font-family:'Sora',sans-serif;
    font-weight:800;
    font-size:clamp(26px,5vw,40px);
    text-align:center;
    text-transform:uppercase;
    letter-spacing:.06em;
    margin:0 0 34px;
    background:linear-gradient(90deg, var(--green-5), var(--blue));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* exam cards */
  .grid2{display:flex;flex-direction:column;gap:18px;margin-bottom:16px;}

  .card{
    background:linear-gradient(180deg, var(--surface), var(--surface) 60%, #0e1210);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 22px 20px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, var(--green-5), var(--blue));
  }
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:10px;}
  .card-tag{
    font-size:11px;letter-spacing:.08em;color:var(--muted-2);text-transform:uppercase;
    font-weight:700;
  }
  .card-title{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;margin-top:4px;}
  .status-pill{
    font-size:10.5px;letter-spacing:.04em;padding:4px 11px;border-radius:20px;
    border:1px solid var(--green-4);color:var(--green-5);background:rgba(8,189,128,.1);
    white-space:nowrap;font-weight:700;text-transform:uppercase;
  }
  .status-pill.past{color:var(--muted);border-color:var(--border);background:transparent;}

  .countdown-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 16px;
  }
  .cbox{
    background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:12px 4px 10px;text-align:center;
  }
  .cbox .num{
    font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(22px,4vw,30px);
    color:var(--text);font-variant-numeric:tabular-nums;line-height:1;
  }
  .cbox.days .num{color:var(--green-5);text-shadow:0 0 18px rgba(8,189,128,.4);}
  .cbox .lbl{font-size:9.5px;letter-spacing:.12em;color:var(--muted-2);margin-top:6px;text-transform:uppercase;font-weight:600;}

  .meta-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap;gap:8px;}
  .meta-row .date-edit{display:flex;align-items:center;gap:7px;}
  .meta-row input[type=date]{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-family:'Inter',sans-serif;font-size:12px;border-radius:6px;padding:4px 8px;
    color-scheme:dark;
  }

  /* heatmap - fixed-size equal squares, consistent spacing */
  .heatmap-wrap{margin-top:16px;width:100%;overflow-x:auto;padding-bottom:2px;}
  .hm-inner{display:inline-block;min-width:100%;}
  .hm-months{display:flex;gap:3px;font-size:9.5px;color:var(--muted-2);height:14px;margin-left:26px;font-weight:600;}
  .hm-months span{width:13px;flex:0 0 13px;text-align:left;}
  .hm-body{display:flex;gap:6px;}
  .hm-daylabels{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--muted-2);width:20px;flex:0 0 20px;justify-content:space-between;padding-top:1px;font-weight:600;}
  .hm-cols{display:flex;gap:3px;}
  .hm-col{display:flex;flex-direction:column;gap:3px;}
  .hm-cell{
    width:13px;height:13px;border-radius:2.5px;background:var(--surface-2);
    border:1px solid rgba(255,255,255,.03);
    position:relative;cursor:default;flex:none;
    transition:transform .1s;
  }
  .hm-cell:hover{transform:scale(1.3);z-index:5;}
  .hm-cell.today{box-shadow:0 0 0 1.5px var(--blue);}
  .hm-cell.exam{box-shadow:0 0 0 1.5px var(--green-5);}
  .hm-cell[data-tip]{cursor:default;}
  #hm-tooltip{
    position:fixed;pointer-events:none;z-index:1000;
    background:#000;border:1px solid var(--border);color:var(--text);font-size:11px;
    padding:5px 9px;border-radius:6px;white-space:nowrap;
    opacity:0;transform:translate(-50%,-130%);transition:opacity .08s;
    font-family:'Inter',sans-serif;
  }
  #hm-tooltip.show{opacity:1;}
  .hm-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted-2);margin-top:10px;justify-content:flex-end;font-weight:600;}
  .hm-legend .hm-cell{width:11px;height:11px;flex:none;}

  footer{
    margin-top:34px;text-align:center;color:var(--muted-2);font-size:11px;line-height:1.9;
  }
  footer a{color:var(--muted);}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="wrap">

  <h1>Days Left for IIT</h1>

  <div class="grid2" id="cards"></div>

  <div id="hm-tooltip"></div>

  <footer>
    built for JEE Legends / Nexus &middot; estimates based on 2025&ndash;2026 NTA &amp; IIT patterns, not official notifications<br>
    verify against <a href="https://jeemain.nta.nic.in" target="_blank">jeemain.nta.nic.in</a> and <a href="https://jeeadv.ac.in" target="_blank">jeeadv.ac.in</a> once released
  </footer>
</div>

<script>
const STORAGE_KEY = 'jee2027-dates';

const DEFAULT_EXAMS = [
  {
    id:'main1',
    title:'JEE Main 2027 - January Attempt',
    sub:'Session 1 · last week of Jan 2027 (tentative)',
    date:'2027-01-24'
  },
  {
    id:'main2',
    title:'JEE Main 2027 - April Attempt',
    sub:'Session 2 · first/second week of Apr 2027 (tentative)',
    date:'2027-04-08'
  },
  {
    id:'adv',
    title:'JEE Advanced 2027',
    sub:'Third week of May 2027 (tentative)',
    date:'2027-05-16'
  }
];

function loadDates(){
  return new Promise(async (resolve)=>{
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){
        resolve(JSON.parse(res.value));
        return;
      }
    }catch(e){}
    resolve({});
  });
}
async function saveDate(id, date){
  try{
    const res = await window.storage.get(STORAGE_KEY).catch(()=>null);
    const current = res && res.value ? JSON.parse(res.value) : {};
    current[id] = date;
    await window.storage.set(STORAGE_KEY, JSON.stringify(current));
  }catch(e){ console.error('storage save failed', e); }
}

function daysBetween(a,b){
  const MS = 86400000;
  const da = new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const db = new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((db-da)/MS);
}
function fmtDate(d){
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}

// Heat is driven by proximity to the EXAM, not distance from today —
// the closer a square is to exam day, the hotter (greener) it burns.
function heatLevel(daysToExam){
  if(daysToExam < 0) return -1;
  if(daysToExam <= 7) return 4;
  if(daysToExam <= 30) return 3;
  if(daysToExam <= 90) return 2;
  if(daysToExam <= 180) return 1;
  return 0;
}
const levelColor = ['#12291f','#0e4530','#0e6b45','#0f9860','#08bd80'];

function buildHeatmap(examDateObj, todayObj){
  const start = new Date(todayObj);
  start.setDate(start.getDate() - start.getDay());
  const end = new Date(examDateObj);
  end.setDate(end.getDate() + (6 - end.getDay()));
  const numDays = daysBetween(start,end) + 1;
  const numWeeks = Math.ceil(numDays/7);

  let cols = [];
  let cursor = new Date(start);
  let monthLabels = [];
  let lastMonth = -1;

  for(let w=0; w<numWeeks; w++){
    let col = [];
    for(let d=0; d<7; d++){
      const dateObj = new Date(cursor);
      const away = daysBetween(todayObj, dateObj);
      const isToday = away === 0;
      const isExam = daysBetween(dateObj, examDateObj) === 0;
      col.push({date:new Date(dateObj), away, isToday, isExam});
      cursor.setDate(cursor.getDate()+1);
    }
    cols.push(col);
    const midDate = col[3].date;
    const m = midDate.getMonth();
    if(m !== lastMonth){
      monthLabels.push(midDate.toLocaleDateString('en-IN',{month:'short'}));
      lastMonth = m;
    } else {
      monthLabels.push('');
    }
  }
  return {cols, monthLabels};
}

function renderHeatmapHTML(examDateObj, todayObj){
  const {cols, monthLabels} = buildHeatmap(examDateObj, todayObj);
  let colsHtml = cols.map((col)=>{
    let cellsHtml = col.map(cell=>{
      if(cell.away < 0 && !cell.isExam){
        return `<div class="hm-cell" style="background:#0d100e;opacity:.35"></div>`;
      }
      const toExam = daysBetween(cell.date, examDateObj);
      if(toExam < 0){
        return `<div class="hm-cell" style="opacity:0;pointer-events:none"></div>`;
      }
      const level = heatLevel(toExam);
      const bg = levelColor[level] || levelColor[0];
      const classes = ['hm-cell'];
      if(cell.isToday) classes.push('today');
      if(cell.isExam) classes.push('exam');
      const tip = cell.isExam ? `${fmtDate(cell.date)} — EXAM DAY` :
                  cell.isToday ? `${fmtDate(cell.date)} — today` :
                  `${fmtDate(cell.date)} — D-${toExam}`;
      return `<div class="${classes.join(' ')}" style="background:${bg}" data-tip="${tip}"></div>`;
    }).join('');
    return `<div class="hm-col">${cellsHtml}</div>`;
  }).join('');

  let monthsHtml = monthLabels.map(m=>`<span>${m}</span>`).join('');

  return `
    <div class="heatmap-wrap">
      <div class="hm-inner">
        <div class="hm-months">${monthsHtml}</div>
        <div class="hm-body">
          <div class="hm-daylabels"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
          <div class="hm-cols">${colsHtml}</div>
        </div>
      </div>
      <div class="hm-legend">
        cooler
        <div class="hm-cell" style="background:${levelColor[0]}"></div>
        <div class="hm-cell" style="background:${levelColor[1]}"></div>
        <div class="hm-cell" style="background:${levelColor[2]}"></div>
        <div class="hm-cell" style="background:${levelColor[3]}"></div>
        <div class="hm-cell" style="background:${levelColor[4]}"></div>
        hotter
      </div>
    </div>
  `;
}

function renderCard(exam, dateStr){
  const examDate = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const isPast = examDate < new Date(now.getFullYear(),now.getMonth(),now.getDate());

  return `
    <div class="card" data-id="${exam.id}">
      <div class="card-head">
        <div>
          <div class="card-title">${exam.title}</div>
        </div>
        <div class="status-pill ${isPast ? 'past' : ''}">${isPast ? 'concluded' : 'upcoming'}</div>
      </div>

      <div class="countdown-row" id="cd-${exam.id}"></div>

      <div id="hm-${exam.id}"></div>

      <div class="meta-row">
        <span>${exam.sub}</span>
        <span class="date-edit">
          target
          <input type="date" id="date-${exam.id}" value="${dateStr}">
        </span>
      </div>
    </div>
  `;
}

function renderCountdown(exam, dateStr){
  const target = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  let diff = target - now;
  if(diff < 0) diff = 0;
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  const el = document.getElementById('cd-'+exam.id);
  if(!el) return;
  el.innerHTML = `
    <div class="cbox days"><div class="num">${d}</div><div class="lbl">days</div></div>
    <div class="cbox"><div class="num">${String(h).padStart(2,'0')}</div><div class="lbl">hrs</div></div>
    <div class="cbox"><div class="num">${String(m).padStart(2,'0')}</div><div class="lbl">min</div></div>
    <div class="cbox"><div class="num">${String(s).padStart(2,'0')}</div><div class="lbl">sec</div></div>
  `;
}

let state = {};

async function init(){
  const saved = await loadDates();
  DEFAULT_EXAMS.forEach(e => { state[e.id] = saved[e.id] || e.date; });

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = DEFAULT_EXAMS.map(e => renderCard(e, state[e.id])).join('');

  DEFAULT_EXAMS.forEach(exam=>{
    const today = new Date();
    document.getElementById('hm-'+exam.id).innerHTML = renderHeatmapHTML(new Date(state[exam.id]+'T00:00:00'), today);
    renderCountdown(exam, state[exam.id]);

    const input = document.getElementById('date-'+exam.id);
    input.addEventListener('change', async (ev)=>{
      const newDate = ev.target.value;
      if(!newDate) return;
      state[exam.id] = newDate;
      document.getElementById('hm-'+exam.id).innerHTML = renderHeatmapHTML(new Date(newDate+'T00:00:00'), new Date());
      renderCountdown(exam, newDate);
      await saveDate(exam.id, newDate);
    });
  });

  setInterval(()=>{
    DEFAULT_EXAMS.forEach(exam => renderCountdown(exam, state[exam.id]));
  }, 1000);
}

init();

/* ---------- floating tooltip for heatmap cells (avoids clipping) ---------- */
(function(){
  const tip = document.getElementById('hm-tooltip');
  document.addEventListener('mouseover', (e)=>{
    const cell = e.target.closest('.hm-cell[data-tip]');
    if(!cell) return;
    tip.textContent = cell.getAttribute('data-tip');
    tip.classList.add('show');
  });
  document.addEventListener('mousemove', (e)=>{
    if(!tip.classList.contains('show')) return;
    tip.style.left = e.clientX + 'px';
    tip.style.top = e.clientY + 'px';
  });
  document.addEventListener('mouseout', (e)=>{
    const cell = e.target.closest('.hm-cell[data-tip]');
    if(!cell) return;
    tip.classList.remove('show');
  });
})();

/* ---------- interactive particle background ---------- */
(function(){
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let w, h, particles = [];
  const mouse = {x:null, y:null, active:false};
  const COLORS = ['8,189,128', '45,129,247']; // green, blue (rgb triples)
  const COUNT_DENSITY = 16000; // px^2 per particle

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = reduceMotion ? 0 : Math.min(110, Math.floor((w*h)/COUNT_DENSITY));
    particles = Array.from({length:count}, () => spawn());
  }
  function spawn(){
    return {
      x: Math.random()*w,
      y: Math.random()*h,
      vx: (Math.random()-0.5)*0.25,
      vy: (Math.random()-0.5)*0.25,
      r: Math.random()*1.6 + 0.8,
      c: COLORS[Math.floor(Math.random()*COLORS.length)]
    };
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', (e)=>{
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseleave', ()=>{ mouse.active = false; });
  window.addEventListener('touchmove', (e)=>{
    if(e.touches && e.touches[0]){
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
    }
  }, {passive:true});
  window.addEventListener('touchend', ()=>{ mouse.active = false; });

  const LINK_DIST = 130;
  const MOUSE_DIST = 160;

  function tick(){
    ctx.clearRect(0,0,w,h);

    // update + draw particles
    for(const p of particles){
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0 || p.x > w) p.vx *= -1;
      if(p.y < 0 || p.y > h) p.vy *= -1;

      // gentle pull toward cursor
      if(mouse.active){
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const d = Math.hypot(dx,dy);
        if(d < MOUSE_DIST && d > 0.1){
          p.x += (dx/d) * 0.18;
          p.y += (dy/d) * 0.18;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.c},0.55)`;
      ctx.fill();
    }

    // links between nearby particles
    for(let i=0; i<particles.length; i++){
      for(let j=i+1; j<particles.length; j++){
        const a = particles[i], b = particles[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const d = Math.hypot(dx,dy);
        if(d < LINK_DIST){
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(8,189,128,${0.12 * (1 - d/LINK_DIST)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    // links to cursor
    if(mouse.active){
      for(const p of particles){
        const dx = mouse.x-p.x, dy = mouse.y-p.y;
        const d = Math.hypot(dx,dy);
        if(d < MOUSE_DIST){
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = `rgba(45,129,247,${0.22 * (1 - d/MOUSE_DIST)})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(tick);
  }

  resize();
  tick();
})();

</script>
</body>
</html>
